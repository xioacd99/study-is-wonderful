vex Optimization", "url": "https://www.bilibili.com/BV12x411z7ot"}], "description": "学习用凸优化在满足限制的选择中寻找最好结果。\nLearn how convex optimization finds the best result among constrained choices."}, {"id": "course-math-10", "subject": "数学 / Math", "group": "优化与数值计算 / Optimization and numerical computing", "title": "数值分析 / Numerical Analysis", "links": [{"label": "数值分析 / Numerical Analysis", "url": "https://www.bilibili.com/BV1gv411j7rd"}], "description": "研究如何用计算机算出近似答案，并分析误差。\nStudy how computers find approximate answers and how to analyze error."}, {"id": "course-math-12", "subject": "数学 / Math", "group": "优化与数值计算 / Optimization and numerical computing", "title": "数值方法 / Numerical Methods", "links": [{"label": "数值方法 / Numerical Methods", "url": "https://www.bilibili.com/BV1sT4y1S7Aa"}], "description": "学习用数值计算近似解决难以直接求解的数学问题。\nLearn numerical ways to approximate solutions to hard mathematical problems."}, {"id": "course-math-07", "subject": "数学 / Math", "group": "优化与数值计算 / Optimization and numerical computing", "title": "最优化进阶与随机方法 / Advanced Optimization and Stochastic Methods", "links": [{"label": "最优化进阶与随机方法 / Advanced Optimization and Stochastic Methods", "url": "https://www.bilibili.com/BV1J64y1F7nW"}], "description": "探索寻找最优解的方法，以及如何处理带有随机性的情况。\nExplore optimization methods and how to handle randomness."}, {"id": "course-math-04", "subject": "数学 / Math", "group": "分析与微分方程 / Analysis and differential equations", "title": "傅里叶变换及其应用 / The Fourier Transform and Its Applications", "links": [{"label": "傅里叶变换及其应用 / The Fourier Transform and Its Applications", "url": "https://www.bilibili.com/BV1Qx411J7ER"}], "description": "认识傅里叶变换如何把复杂信号拆成不同频率的成分。\nSee how the Fourier transform breaks a complex signal into frequencies."}, {"id": "course-math-18", "subject": "数学 / Math", "group": "分析与微分方程 / Analysis and differential equations", "title": "傅里叶分析 / Fourier Analysis", "links": [{"label": "傅里叶分析 / Fourier Analysis", "url": "https://www.bilibili.com/BV1Qz4y167rb"}], "descriptio nd geometric shapes using discrete points and meshes."}, {"id": "course-math-25", "subject": "数学 / Math", "group": "几何与离散数学 / Geometry and discrete mathematics", "title": "黎曼几何 / Riemannian Geometry", "links": [{"label": "黎曼几何 / Riemannian Geometry", "url": "https://www.bilibili.com/BV19T4y1M7W5"}], "description": "研究弯曲空间中的距离与曲率，像理解地球表面的几何。\nStudy distance and curvature in curved spaces, such as the surface of Earth."}, {"id": "course-math-13", "subject": "数学 / Math", "group": "概率、统计与随机过程 / Probability, statistics and stochastic processes", "title": "概率论 / Probability", "links": [{"label": "概率论 / Probability", "url": "https://www.bilibili.com/BV1kE41157pa"}], "description": "用概率描述不确定性，例如事情发生的可能性。\nUse probability to describe uncertainty, such as how likely an event is."}, {"id": "course-math-15", "subject": "数学 / Math", "group": "概率、统计与随机过程 / Probability, statistics and stochastic processes", "title": "概率论 / Probability", "links": [{"label": "概率论 / Probability", "url": "https://www.bilibili.com/BV19s41167TE"}], "description": "学习用概率和随机变量描述不确定的结果。\nLearn to describe uncertain outcomes using probability and random variables."}, {"id": "course-math-16", "subject": "数学 / Math", "group": "概率、统计与随机过程 / Probability, statistics and stochastic processes", "title": "应用统计 / Applied Statistics", "links": [{"label": "应用统计 / Applied Statistics", "url": "https://www.bilibili.com/BV14t411N7uw"}], "description": "学习从数据中估计、比较并作出有依据的判断。\nLearn to estimate, compare and make informed judgments from data."}, {"id": "course-math-11", "subject": "数学 / Math", "group": "概率、统计与随机过程 / Probability, statistics and stochastic processes", "title": "随机过程 / Stochastic Processes", "links": [{"label": "随机过程 / Stochastic Processes", "url": "https://www.bilibili.com/BV1qB4y1A7t3"}], "description": "研究随时间变化、结果带有不确定性的过程。\nStudy processes that change over time with uncertain outcomes."}, {"id": "course-math-17", "subject": "数学 / Math", "group": "概率、统计与随机过程 / Probability, statistics and stochastic processes
