else y+=128;const sy=start+(y-start-24)/2-38;const b=node('subject',280,sy,label(s,'subject'),()=>{expanded.has(s)?expanded.delete(s):expanded.add(s);render()});b.style.setProperty('--accent',palette[subjects.indexOf(s)]);b.setAttribute('aria-expanded',String(open));b.dataset.subject=s;b.style.setProperty('--order',String(subjects.indexOf(s)*1000));const count=document.createElement('span');count.className='count';count.textContent=(open?'− ':'＋ ')+c.length+' '+UI[lang].course;b.append(count);edges.push([235,null,280,sy+38]);for(const gy of groupPositions)edges.push([510,sy+38,570,gy]);}
const height=Math.max(480,y),width=1280,rootY=height/2;node('root',30,rootY-52,UI[lang].root,()=>home());edges.forEach(e=>{if(e[1]===null)e[1]=rootY});drawEdges(edges,width,height);sizeGraph(width,height);document.querySelector('#status').textContent=`${COURSES.length} ${UI[lang].course} · ${shown.length} ${UI[lang].subject} · ${n} ${UI[lang].visible}`;if(!shown.length){const empty=document.createElement('p');empty.id='empty';empty.textContent=UI[lang].empty;graph.append(empty)};}

if(graphFolded.has(key)&&!query)return;gc.forEach((course,ci)=>{const ca=ga+(ci-(gc.length-1)/2)*.48;const n=add(course.id,'course',local(course).title,group.x+Math.cos(ca)*(190+ci%2*65),group.y+Math.sin(ca)*(190+ci%2*65),210,56,group,null,sub.color);n.course=course});});});
// Deterministic spring layout: only catalog membership edges, never inferred prerequisites.
for(let step=0;step<220;step++){const force=nodes.map(()=>({x:0,y:0}));for(let i=0;i<nodes.length;i++){const a=nodes[i];for(let j=i+1;j<nodes.length;j++){const b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;if(Math.abs(dx)+Math.abs(dy)<.01){dx=.1*(j+1);dy=.13*(i+1)}const dist=Math.hypot(dx,dy),gapX=(a.w+b.w)/2+24-Math.abs(dx),gapY=(a.h+b.h)/2+24-Math.abs(dy);let strength=6000/(dist*dist+500);if(gapX>0&&gapY>0)strength+=Math.min(gapX,gapY)*.18;force[i].x-=dx/dist*strength;force[i].y-=dy/dist*strength;force[j].x+=dx/dist*strength;force[j].y+=dy/dist*strength;}}
for(const[a,b]of links){const bi=nodes.indexOf(b),ai=nodes.indexOf(a),dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy)),target=b.cls==='subject'?(selected?200:650):b.cls==='group'?240:170,k=(d-target)*.025;force[bi].x-=dx/d*k;force[bi].y-=dy/d*k;force[ai].x+=dx/d*k;force[ai].y+=dy/d*k;}
nodes.forEach((n,i)=>{if(i){n.x+=Math.max(-15,Math.min(15,force[i].x));n.y+=Math.max(-15,Math.min(15,force[i].y))}});}
// Resolve remaining label collisions without changing any graph relationship.
for(let k=0;k<35;k++)for(let i=1;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,ox=(a.w+b.w)/2+12-Math.abs(dx),oy=(a.h+b.h)/2+12-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){const push=(ox+.2)/2*(dx>=0?1:-1);a.x-=push;b.x+=push}else{const push=(oy+.2)/2*(dy>=0?1:-1);a.y-=push;b.y+=push}}}
const minX=Math.min(...nodes.map(n=>n.x-n.w/2))-70,minY=Math.min(...nodes.map(n=>n.y-n.h/2))-70,width=Math.max(700,Math.max(...nodes.map(n=>n.x+n.w/2))-minX+70),height=Math.max(560,Math.max(...nodes.map(n=>n.y+n.h/2))-minY+70);
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',width);svg.setAttribute('height',height);for(const[a,b]of links){const line=document.createElementNS(svg.namespaceURI,'path');line.setAttribute('d',`M${a.x-minX},${a.y-minY} Q${(a.x+b.x)/2-minX+20},${(a.y+b.y)/2-minY-20} ${b.x-minX},${b.y-minY}`);line.style.stroke=b.color||'#a5b9a0';line.style.opacity='.55';svg.append(line)}graph.append(svg);
for(const n of nodes){const el=node(n.cls,n.x-n.w/2-minX,n.y-n.h/2-minY,n.text,()=>n.course?show(n.course,el):n.fn());el.style.width=n.w+'px';el.style.height=n.h+'px';el.style.minHeight=n.h+'px';el.style.setProperty('--accent',n.color||'#427962');if(n.course){el.dataset.course=n.id;el.title=n.text}else if(n.id!=='root'){const count=document.createElement('span');count.className='count';count.textContent=n.count+' '+UI[lang].course;el.append(count)}el.dataset.graphNode=n.id;if(n.parent)el.dataset.parent=n.parent.id;el.setAttribute('aria-label',n.text);}
sizeGraph(width,height);document.querySelector('#status').textContent=`${nodes.filter(n=>n.course).length} / ${COURSES.length} ${UI[lang].course} · ${shown.length} ${UI[lang].subject}`;if(!shown.length){const empty=document.createElement('p');empty.id='empty';empty.textContent=UI[lang].empty;graph.append(empty)}
}
function show(c,b){lastNode=b;const d=local(c);const heading=document.querySelector('#detail-title');heading.replaceChildren();title(heading,d.title);document.querySelector('#description').textContent=d.description;const sources=document.querySelector('#sources');sources.replaceChildren();for(const link of d.links){const a=document.createElement('a');const src=link.source||'';const openLabel=lang==='zh'?'打开课程入口':'Open course';a.textContent=(src?(link.label===d.title?src+' · '+openLabel:src+' · '+link.label):link.label)+' ↗';a.href=link.url;a.target='_blank';a.rel='noopener noreferrer';sources.append(a)}const readme=document.createElement('a');readme.textContent=UI[lang].readme;readme.href='https://github.com/xioacd99/study-is-wonderful/blob/dev/'+(lang==='zh'?'README.md':'README-en.md')+'#'+c.id;readme.target='_blank';readme.rel='noopener';sources.append(readme);dialog.showModal()}
document.querySelector('#return').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastNode?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function home(){graphCollapsed=false;graphFolded.clear();selected='';fullTree=false;document.querySelector('#subject-filter').value='';query='';document.querySelector('#search').value='';expanded.clear();zoom=1;render();fit();viewport.scrollTo(0,0)}document.querySelector('#home').onclick=home;
document.querySelector('#expand').onclick=()=>{graphCollapsed=false;graphFolded.clear();fullTree=true;COURSES.forEach(c=>{expanded.add(c.subject);expanded.add(c.subject+'|'+c.group)});render()};document.querySelector('#collapse').onclick=()=>{graphCollapsed=true;fullTree=false;expanded.clear();query='';document.querySelector('#search').value='';render();fit()};document.querySelector('#search').oninput=e=>{query=e.target.value;render();fit();viewport.scrollTo(0,0)};
function setZoom(next){const cx=(viewport.scrollLeft+viewport.clientWidth/2)/zoom,cy=(viewport.scrollTop+viewport.clientHeight/2)/zoom;zoom=Math.max(.12,Math.min(1.8,next));render();viewport.scrollTo(cx*zoom-viewport.clientWidth/2,cy*zoom-viewport.clientHeight/2)}document.querySelector('#plus').onclick=()=>setZoom(zoom*1.4);document.querySelector('#minus').onclick=()=>setZoom(zoom/1.4);for(const v of ['map','list'])document.querySelector('#'+v+'-view').onclick=()=>{view=v;render();if(v==='map')fit();else viewport.scrollTo(0,0)};
function fit(){if(view==='list')return;zoom=Math.max(.12,Math.min(1.15,(viewport.clientWidth-28)/graphWidth,(viewport.clientHeight-28)/graphHeight));render();viewport.scrollTo(Math.max(0,(graphWidth*zoom-viewport.clientWidth)/2),0)}
document.querySelector('#fit').onclick=fit;document.querySelector('#subject-filter').onchange=e=>{graphCollapsed=false;selected=e.target.value;expanded.clear();if(selected)expanded.add(selected);fullTree=false;render();fit()};
let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!e.target.closest('button')){drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId)}});viewport.addEventListener('pointermove',e=>{if(drag){viewport.scrollLeft=drag.left-(e.clientX-drag.x);viewport.scrollTop=drag.top-(e.clientY-drag.y)}});viewport.addEventListener('pointerup',()=>drag=null);viewport.addEventListener('pointercancel',()=>drag=null);
applyLanguage();requestAnimationFrame(fit);
