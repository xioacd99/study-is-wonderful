</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><img src="icon.png?v=gradient-2" alt="" width="38" height="38"><span>STUDY IS WONDERFUL</span></div><div class="eyebrow" id="eyebrow"></div><h1 id="app-title"></h1><p id="tagline"></p><div class="nav-label" id="nav-label"></div><div id="subject-nav"></div><select id="subject-filter"></select></aside><section class="workspace"><header class="topbar"><input id="search" type="search"><nav id="language" aria-label="Language"><button id="zh" lang="zh-CN">中文</button><button id="en" lang="en">English</button></nav></header><div class="canvas-head"><div class="canvas-copy"><span class="canvas-title" id="canvas-title"></span><span id="status" aria-live="polite"></span></div><div id="views"><button id="map-view"></button><button id="list-view"></button></div></div><div class="canvas-wrap"><main id="viewport" tabindex="0"><div id="space"><div id="graph"></div></div></main><div class="canvas-tools"><button id="expand"></button><button id="collapse"></button><span class="tool-separator"></span><button id="minus">−</button><button id="plus">＋</button><button id="fit"></button><button id="home"></button></div></div><footer><span id="hint"></span><a id="readme" target="_blank" rel="noopener"></a></footer></section></div>
<dialog id="detail"><button id="return"></button><h2 id="detail-title"></h2><p id="description"></p><div class="sources" id="sources"></div></dialog>
<script>
const COURSES=/*__COURSES__*/;
const graph=document.querySelector('#graph'),viewport=document.querySelector('#viewport'),space=document.querySelector('#space'),dialog=document.querySelector('#detail');
let lang='zh';try{lang=localStorage.getItem('study-language')==='en'?'en':'zh'}catch{};
const UI={zh:{title:'学习星图',eyebrow:'让好奇心，连接下一程',tagline:'循着兴趣展开，找到下一门好课。',search:'搜索课程、学校或主题…',expand:'全部展开',collapse:'全部收起',home:'返回全景',back:'← 返回资源图',hint:'点击主题展开，点击课程查看介绍与学习入口。',readme:'阅读完整目录 ↗',empty:'没有找到课程，试试其他关键词。',root:'学习资源',course:'门课程',subject:'学科',visible:'已展开',minus:'缩小',plus:'放大',fit:'适应画布',all:'全部学科',filter:'选择学科',map:'思维导图',list:'分层列表',gesture:'滑动探索连线 · 点击节点展开 · ＋/− 调整大小'},en:{title:'Learning, connected.',eyebrow:'STUDY IS WONDERFUL',tagline:'Follow your curiosity. Find your next course.',search:'Search courses, schools or topics…',expand:'Expand all',collapse:'Collapse all',home:'Overview',back:'← Back to map',hint:'Expand a topic. Select a course for details and learning links.',readme:'Browse the full catalog ↗',empty:'No courses found. Try another keyword.',root:'Learning resources',course:'courses',subject:'subjects',visible:'visible',minus:'Zoom out',plus:'Zoom in',fit:'Fit view',all:'All subjects',filter:'Choose subject',map:'Mind map',list:'List',gesture:'Swipe to explore · Tap nodes to expand · Use +/− to zoom'}};
const local=c=>c.locales[lang];const label=(s,kind)=>local(COURSES.find(c=>c[kind]===s))[kind];
function applyLanguage(){const t=UI[lang];document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t.title+' · Study Is Wonderful';for(const [id,k] of Object.entries({'app-title':'title',eyebrow:'eyebrow',tagline:'tagline',expand:'expand',collapse:'collapse',home:'home',fit:'fit',return:'back',hint:'hint',readme:'readme','map-view':'map','list-view':'list'}))document.getElementById(id).textContent=t[k];const input=document.querySelector('#search');input.placeholder=t.search;input.setAttribute('aria-label',t.search);document.querySelector('#minus').setAttribute('aria-label',t.minus);document.querySelector('#plus').setAttribute('aria-label',t.plus);document.querySelector('#viewport').setAttribute('aria-label',t.title);document.querySelector('#readme').href='https://github.com/xioacd99/study-is-wonderful/blob/dev/'+(lang==='zh'?'README.md':'README-en.md')+'#resource-map';const select=document.querySelector('#subject-filter');select.setAttribute('aria-label',t.filter);select.replaceChildren();for(const value of ['',...subjects]){const option=document.createElement('option');option.value=value;option.textContent=value?label(value,'subject'):t.all;select.append(option)}select.value=selected;for(const l of ['zh','en'])document.getElementById(l).setAttribute('aria-pressed',String(lang===l));render()}
for(const l of ['zh','en'])document.getElementById(l).onclick=()=>{lang=l;try{localStorage.setItem('study-language',l)}catch{};applyLanguage()};
const subjects=[...new Set(COURSES.map(c=>c.subject))],expanded=new Set();let zoom=window.innerWidth<=600?.65:1,lastNode=null,query='',view='map',selected='',fullTree=false,graphWidth=1000,graphHeight=590;
const palette=['#9c8ae1','#85a1dc','#b89cdd','#e2b98c','#86b7b6','#d698b7','#a09bcf','#a8bb8f','#d3aa93','#87b7d2'];
function title(el,text){const a=document.createElement('span');a.className='title';a.textContent=text;el.append(a)}
function node(cls,x,y,text,fn){const b=document.createElement('button');b.type='button';b.className='node '+cls;b.style.left=x+'px';b.style.top=y+'px';title(b,text);b.onclick=fn;graph.append(b);return b}
function drawEdges(edges,width,height){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',width);svg.setAttribute('height',height);for(const [x1,y1,x2,y2,color]of edges){const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);p.style.stroke=color||'#a4beb2';svg.append(p)}graph.prepend(svg)}
function sizeGraph(width,height){graphWidth=width;graphHeight=height;graph.style.width=width+'px';graph.style.height=height+'px';space.style.width=width*zoom+'px';space.style.height=height*zoom+'px';graph.style.transform=`scale(${zoom})`;graph.style.setProperty('--graph-width',width+'px');graph.style.setProperty('--graph-height',height+'px');graph.style.setProperty('--zoom',zoom);space.style.setProperty('--space-width',width*zoom+'px');space.style.setProperty('--space-height',height*zoom+'px')}
function focusSubject(s){selected=s;fullTree=false;expanded.clear();expanded.add(s);document.querySelector('#subject-filter').value=s;render();fit()}
function render(){document.querySelector('#nav-label').textContent=lang==='zh'?'探索学科':'EXPLORE SUBJECTS';document.querySelector('#canvas-title').textContent=selected?label(selected,'subject'):(lang==='zh'?'知识的每一条路径':'Every path starts with curiosity');const nav=document.querySelector('#subject-nav');nav.replaceChildren();for(const s of ['',...subjects]){const b=document.createElement('button');b.setAttribute('aria-pressed',String(s===selected));const name=document.createElement('span');name.textContent=s?label(s,'subject'):UI[lang].all;const count=document.createElement('span');count.textContent=s?COURSES.filter(c=>c.subject===s).length:COURSES.length;b.append(name,count);b.onclick=()=>s?focusSubject(s):home();nav.append(b)}document.body.dataset.view=view;document.querySelector('#map-view').setAttribute('aria-pressed',String(view==='map'));document.querySelector('#list-view').setAttribute('aria-pressed',String(view==='list'));document.querySelector('#hint').textContent=UI[lang][view==='map'?'gesture':'hint'];graph.replaceChildren();const edges=[],q=query.toLocaleLowerCase();let y=34,n=0;const shown=subjects.filter(s=>!selected||s===selected).map(s=>({s,c:COURSES.filter(c=>c.subject===s&&(!q||(c.title+' '+c.description+' '+c.subject+' '+c.group).toLocaleLowerCase().includes(q)))})).filter(x=>x.c.length);
if(!selected&&!q&&!fullTree&&view==='map'){const compact=window.innerWidth<=760;const edge=[];subjects.forEach((s,i)=>{const left=i<5,x=compact?(left?30:320):(left?30:740),cy=(compact?170:26)+(i%5)*110;const b=node('subject',x,cy,label(s,'subject'),()=>focusSubject(s));b.style.setProperty('--accent',palette[i]);b.dataset.subject=s;b.setAttribute('aria-expanded','false');const count=document.createElement('span');count.className='count';count.textContent=COURSES.filter(c=>c.subject===s).length+' '+UI[lang].course+' →';b.append(count);edge.push(compact?[290,120,left?260:320,cy+38,palette[i]]:[left?390:595,285,left?260:740,cy+38,palette[i]])});node('root',compact?187:390,compact?16:233,UI[lang].root,()=>home());drawEdges(edge,compact?580:1000,compact?750:590);sizeGraph(compact?580:1000,compact?750:590);document.querySelector('#status').textContent=`${COURSES.length} ${UI[lang].course} · ${subjects.length} ${UI[lang].subject}`;return}
for(const {s,c} of shown){const open=expanded.has(s)||!!q,start=y;const groupPositions=[];
if(open){for(const g of [...new Set(c.map(x=>x.group))]){const gc=c.filter(x=>x.group===g),key=s+'|'+g,go=expanded.has(key)||!!q,gh=go?gc.length*102:104,gy=y+gh/2-38;const gb=node('group',570,gy,label(g,'group'),()=>{expanded.has(key)?expanded.delete(key):expanded.add(key);render()});gb.setAttribute('aria-expanded',String(go));gb.dataset.group=key;gb.style.setProperty('--order',String(subjects.indexOf(s)*1000+c.indexOf(gc[0])*2+1));const ct=document.createElement('span');ct.className='count';ct.textContent=(go?'− ':'＋ ')+gc.length+' '+UI[lang].course;gb.append(ct);groupPositions.push(gy+38);if(go)gc.forEach((course,i)=>{const cy=y+i*102,b=node('course',900,cy,local(course).title,()=>show(course,b));b.dataset.course=course.id;b.title=local(course).title;b.style.setProperty('--order',String(subjects.indexOf(s)*1000+c.indexOf(course)*2+2));edges.push([820,gy+38,900,cy+43]);n++});y+=gh+24}}
else y+=128;const sy=start+(y-start-24)/2-38;const b=node('subject',280,sy,label(s,'subject'),()=>{expanded.has(s)?expanded.delete(s):expanded.add(s);render()});b.style.setProperty('--accent',palette[subjects.indexOf(s)]);b.setAttribute('aria-expanded',String(open));b.dataset.subject=s;b.style.setProperty('--order',String(subjects.indexOf(s)*1000));const count=document.createElement('span');count.className='count';count.textContent=(open?'− ':'＋ ')+c.length+' '+UI[lang].course;b.append(count);edges.push([235,null,280,sy+38]);for(const gy of groupPositions)edges.push([510,sy+38,570,gy]);}
const height=Math.max(480,y),width=1280,rootY=height/2;node('root',30,rootY-52,UI[lang].root,()=>home());edges.forEach(e=>{if(e[1]===null)e[1]=rootY});drawEdges(edges,width,height);sizeGraph(width,height);document.querySelector('#status').textContent=`${COURSES.length} ${UI[lang].course} · ${shown.length} ${UI[lang].subject} · ${n} ${UI[lang].visible}`;if(!shown.length){const empty=document.createElement('p');empty.id='empty';empty.textContent=UI[lang].empty;graph.append(empty)};}
function show(c,b){lastNode=b;const d=local(c);const heading=document.querySelector('#detail-title');heading.replaceChildren();title(heading,d.title);document.querySelector('#description').textContent=d.description;const sources=document.querySelector('#sources');sources.replaceChildren();for(const link of d.links){const a=document.createElement('a');a.textContent=link.label+' ↗';a.href=link.url;a.target='_blank';a.rel='noopener noreferrer';sources.append(a)}const readme=document.createElement('a');readme.textContent=UI[lang].readme;readme.href='https://github.com/xioacd99/study-is-wonderful/blob/dev/'+(lang==='zh'?'README.md':'README-en.md')+'#'+c.id;readme.target='_blank';readme.rel='noopener';sources.append(readme);dialog.showModal()}
document.querySelector('#return').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastNode?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function home(){selected='';fullTree=false;document.querySelector('#subject-filter').value='';query='';document.querySelector('#search').value='';expanded.clear();zoom=1;render();fit();viewport.scrollTo(0,0)}document.querySelector('#home').onclick=home;
document.querySelector('#expand').onclick=()=>{fullTree=true;COURSES.forEach(c=>{expanded.add(c.subject);expanded.add(c.subject+'|'+c.group)});render()};document.querySelector('#collapse').onclick=()=>{fullTree=false;expanded.clear();query='';document.querySelector('#search').value='';render()};document.querySelector('#search').oninput=e=>{query=e.target.value;render();viewport.scrollTo(0,0)};
document.querySelector('#plus').onclick=()=>{zoom=Math.min(1.6,zoom+.15);render()};document.querySelector('#minus').onclick=()=>{zoom=Math.max(.4,zoom-.15);render()};for(const v of ['map','list'])document.querySelector('#'+v+'-view').onclick=()=>{view=v;render();if(v==='map')fit();else viewport.scrollTo(0,0)};
function fit(){if(view==='list')return;zoom=Math.max(window.innerWidth<=600?.6:.25,Math.min(1.15,(viewport.clientWidth-28)/graphWidth,(viewport.clientHeight-28)/graphHeight));render();viewport.scrollTo(Math.max(0,(graphWidth*zoom-viewport.clientWidth)/2),0)}
document.querySelector('#fit').onclick=fit;document.querySelector('#subject-filter').onchange=e=>{selected=e.target.value;expanded.clear();if(selected)expanded.add(selected);fullTree=false;render();fit()};
let drag=null;viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!e.target.closest('button')){drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId)}});viewport.addEventListener('pointermove',e=>{if(drag){viewport.scrollLeft=drag.left-(e.clientX-drag.x);viewport.scrollTop=drag.top-(e.clientY-drag.y)}});viewport.addEventListener('pointerup',()=>drag=null);viewport.addEventListener('pointercancel',()=>drag=null);
applyLanguage();requestAnimationFrame(fit);
</script></body></html>
