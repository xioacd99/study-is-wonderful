<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习星图 · Study Is Wonderful</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#193632;background:#f4f5ef}*{box-sizing:border-box}body{margin:0}header{padding:28px 32px 18px;border-bottom:1px solid #d7dfd8;background:#fafbf7}h1{font-size:27px;letter-spacing:-1px;margin:8px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#527c6e}p{line-height:1.6;color:#63756c}header p{margin:6px 0;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 32px;align-items:center;border-bottom:1px solid #d7dfd8}button,input,.back{font:inherit;border:1px solid #cbd9d1;background:white;border-radius:9px;padding:10px 13px;color:inherit}button{cursor:pointer}button:hover{background:#e9f3eb}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #dc9149;outline-offset:2px}input{min-width:230px;flex:1;max-width:390px}#status{font-size:12px;color:#62756c}#viewport{height:calc(100vh - 238px);min-height:440px;overflow:auto;position:relative;background-image:radial-gradient(#b9cbc1 1px,transparent 1px);background-size:22px 22px}#space{position:relative;transform-origin:top left}#graph{position:relative;transform-origin:top left}svg{position:absolute;inset:0;pointer-events:none}path{stroke:#a4beb2;stroke-width:2;fill:none}.node{position:absolute;text-align:left;box-shadow:0 3px 12px #1d46330b;white-space:normal;overflow:hidden}.root{background:#214e43!important;color:white;font-size:19px;border:0;width:205px;height:104px}.subject{border-left:5px solid var(--accent);width:230px;min-height:74px;font-weight:650}.group{width:250px;min-height:74px;border-left:3px solid #b5c7bb}.course{width:340px;height:86px;background:#fff}.en{display:block;font-size:11px;font-weight:400;line-height:1.35;color:#678277;margin-top:5px}.root .en{color:#bcd7cc}.title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.4}.course .en{-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}.count{font-size:11px;display:block;margin-top:6px;color:#628172}dialog{border:1px solid #cedbd0;border-radius:20px;padding:28px;max-width:620px;width:calc(100% - 32px);max-height:85vh;box-shadow:0 20px 100px #173f3340}dialog::backdrop{background:#102c2566;backdrop-filter:blur(3px)}dialog h2{font-size:21px;margin:16px 0}dialog h2 .en{font-size:15px}dialog p{white-space:pre-line;font-size:14px}.sources{display:grid;gap:10px;margin:24px 0}.sources a,.back{color:#1b6652;text-decoration:none}.sources a{padding:12px;border:1px solid #d1dfd5;border-radius:9px}footer{font-size:11px;padding:10px 32px;color:#6a7a70}a{color:#246c56}@media(max-width:600px){header{padding:20px}h1{font-size:23px}.toolbar{padding:12px;gap:6px}.toolbar button{font-size:12px;padding:9px}input{min-width:100%;max-width:100%}#viewport{height:60vh}footer{padding:10px 16px}}
</style></head><body>
<header><div class="eyebrow">A MAP FOR THE CURIOUS</div><h1>学习星图 <span style="font-weight:400">/ Study Is Wonderful</span></h1><p>展开一条分支，发现下一门好课。<br>Expand a branch. Find your next course.</p></header>
<div class="toolbar"><input id="search" type="search" aria-label="搜索课程 Search courses" placeholder="搜索课程、学校 / Search courses…"><button id="expand">全部展开 Expand</button><button id="collapse">收起 Collapse</button><button id="minus" aria-label="缩小 Zoom out">−</button><button id="plus" aria-label="放大 Zoom in">＋</button><button id="home">返回全景 Home</button><span id="status" aria-live="polite"></span></div>
<main id="viewport" aria-label="课程思维导图 Course mind map"><div id="space"><div id="graph"></div></div></main>
<footer>点击学科展开 / Select a subject to expand · 点击课程查看详情 / Select a course for details · <a href="https://github.com/xioacd99/study-is-wonderful/tree/dev#resource-map" target="_blank" rel="noopener">README 导航 / README navigation</a></footer>
<dialog id="detail"><button id="return">↩ 返回资源图 / Back to map</button><h2 id="detail-title"></h2><p id="description"></p><div class="sources" id="sources"></div></dialog>
<script>
const COURSES=/*__COURSES__*/;
const graph=document.querySelector('#graph'),viewport=document.querySelector('#viewport'),space=document.querySelector('#space'),dialog=document.querySelector('#detail');
const subjects=[...new Set(COURSES.map(c=>c.subject))],expanded=new Set();let zoom=1,lastNode=null,query='';
const palette=['#4b8b72','#6c87ad','#aa8a50','#9b728e','#719789','#b17b61','#8e8caf','#96a059','#bd8f52','#5c9299'];
function title(el,text){const pair=text.split(/\s+\/\s+/);const a=document.createElement('span');a.className='title';a.textContent=pair.shift();el.append(a);if(pair.length){const b=document.createElement('span');b.className='en';b.textContent=pair.join(' / ');el.append(b)}}
function node(cls,x,y,text,fn){const b=document.createElement('button');b.type='button';b.className='node '+cls;b.style.left=x+'px';b.style.top=y+'px';title(b,text);b.onclick=fn;graph.append(b);return b}
function render(){graph.replaceChildren();const edges=[],q=query.toLocaleLowerCase();let y=34,n=0;const shown=subjects.map(s=>({s,c:COURSES.filter(c=>c.subject===s&&(!q||(c.title+' '+c.description).toLocaleLowerCase().includes(q)))})).filter(x=>x.c.length);
for(const {s,c} of shown){const open=expanded.has(s)||!!q,start=y;const groupPositions=[];
if(open){for(const g of [...new Set(c.map(x=>x.group))]){const gc=c.filter(x=>x.group===g),key=s+'|'+g,go=expanded.has(key)||!!q,gh=go?gc.length*102:104,gy=y+gh/2-38;const gb=node('group',570,gy,g,()=>{expanded.has(key)?expanded.delete(key):expanded.add(key);render()});gb.setAttribute('aria-expanded',String(go));gb.dataset.group=key;const ct=document.createElement('span');ct.className='count';ct.textContent=(go?'− ':'＋ ')+gc.length+' courses';gb.append(ct);groupPositions.push(gy+38);if(go)gc.forEach((course,i)=>{const cy=y+i*102,b=node('course',900,cy,course.title,()=>show(course,b));b.dataset.course=course.id;b.title=course.title;edges.push([820,gy+38,900,cy+43]);n++});y+=gh+24}}
else y+=128;const sy=start+(y-start-24)/2-38;const b=node('subject',280,sy,s,()=>{expanded.has(s)?expanded.delete(s):expanded.add(s);render()});b.style.setProperty('--accent',palette[subjects.indexOf(s)]);b.setAttribute('aria-expanded',String(open));b.dataset.subject=s;const count=document.createElement('span');count.className='count';count.textContent=(open?'− ':'＋ ')+c.length+' 门课程 / courses';b.append(count);edges.push([235,82,280,sy+38]);for(const gy of groupPositions)edges.push([510,sy+38,570,gy]);}
node('root',30,30,'学习资源 / Learning resources',()=>home());const height=Math.max(450,y),width=1280;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',width);svg.setAttribute('height',height);for(const [x1,y1,x2,y2]of edges){const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);svg.append(p)}graph.prepend(svg);graph.style.width=width+'px';graph.style.height=height+'px';space.style.width=width*zoom+'px';space.style.height=height*zoom+'px';graph.style.transform=`scale(${zoom})`;document.querySelector('#status').textContent=`${COURSES.length} 门课程 · ${shown.length} 学科 · ${n} 已展开`;}
function show(c,b){lastNode=b;const heading=document.querySelector('#detail-title');heading.replaceChildren();title(heading,c.title);document.querySelector('#description').textContent=c.description;const sources=document.querySelector('#sources');sources.replaceChildren();for(const link of c.links){const a=document.createElement('a');a.textContent=link.label+' ↗';a.href=link.url;a.target='_blank';a.rel='noopener noreferrer';sources.append(a)}const readme=document.createElement('a');readme.textContent='README 中的课程 / Course in README ↗';readme.href='https://github.com/xioacd99/study-is-wonderful/tree/dev#'+c.id;readme.target='_blank';readme.rel='noopener';sources.append(readme);dialog.showModal()}
document.querySelector('#return').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastNode?.focus());dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
function home(){query='';document.querySelector('#search').value='';expanded.clear();zoom=1;render();viewport.scrollTo(0,0)}document.querySelector('#home').onclick=home;
document.querySelector('#expand').onclick=()=>{COURSES.forEach(c=>{expanded.add(c.subject);expanded.add(c.subject+'|'+c.group)});render()};document.querySelector('#collapse').onclick=()=>{expanded.clear();query='';document.querySelector('#search').value='';render()};document.querySelector('#search').oninput=e=>{query=e.target.value;render();viewport.scrollTo(0,0)};
document.querySelector('#plus').onclick=()=>{zoom=Math.min(1.6,zoom+.15);render()};document.querySelector('#minus').onclick=()=>{zoom=Math.max(.4,zoom-.15);render()};render();
</script></body></html>
