<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习星图 · Study Is Wonderful</title><link rel="icon" href="icon.png?v=teal-orbit-3">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#223831;background:#f5f8f4;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;padding:18px;min-height:100vh;background:radial-gradient(ellipse at 85% 0,#eaf1e5 0,transparent 48%),#f5f8f4}
button,input,select{font:inherit;color:inherit}
button,select{cursor:pointer}
button,a,input,select{outline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bd9b49}
button{border:1px solid #dde6da;background:#fff;border-radius:10px;padding:9px 12px;font-size:12px;transition:background .15s,box-shadow .15s,opacity .15s}
button:hover{background:#eef5ea;box-shadow:0 3px 10px #2d6a5412}
a{color:#2d6a54;text-decoration:none}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1800px;margin:auto;height:calc(100vh - 36px);min-height:640px;border:1px solid #dfe7dd;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 16px 65px #22443309}
.sidebar{padding:24px 18px;background:#fbfcf9;border-right:1px solid #e6ece3;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:1.1px;font-weight:650;color:#62786c}
.brand img{width:38px;height:38px;object-fit:contain}
.eyebrow{display:none}
h1{font-size:28px;letter-spacing:-.8px;line-height:1.15;margin:28px 0 10px;font-weight:650}
.sidebar p{font-size:12px;line-height:1.65;color:#738578;margin:0 0 24px}
.nav-label{font-size:10px;color:#8fa093;letter-spacing:1.4px;text-transform:uppercase;margin:6px 10px 10px}
#subject-nav{display:grid;gap:3px}
#subject-nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:10px 12px;font-size:12px;color:#687a6d;border-radius:10px}
#subject-nav button[aria-pressed=true]{background:#e8f1e6;color:#275d48;font-weight:650}
#subject-nav button span:last-child{font-size:10px;color:#889b8d}
#subject-filter{display:none}
.workspace{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{height:76px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid #e7ede4}
#search{border:1px solid transparent;background:#f1f5ee;padding:11px 16px;border-radius:12px;min-width:0;flex:1;max-width:460px;font-size:13px;transition:border-color .15s,background .15s}
#search:focus{background:#fff;border-color:#b8cab9}
#search::placeholder{color:#8fa090}
#language{margin-left:auto;display:flex;gap:3px;padding:3px;background:#f1f5ee;border-radius:10px}
#language button{border:0;background:none;font-size:11px;padding:7px 10px}
#language button[aria-pressed=true]{background:#fff;color:#2d6a54;box-shadow:0 2px 6px #304a3110}
.canvas-head{padding:14px 26px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.canvas-copy{display:flex;flex-direction:column;gap:4px}
.canvas-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb-btn{border:0;background:none;padding:0;font-size:15px;font-weight:500;color:#2d6a54}
.crumb-btn:hover{background:none;box-shadow:none;text-decoration:underline}
.crumb-sep{color:#9ab09e;font-weight:400}
#status{font-size:11px;color:#7e9182}
#views{display:flex;gap:2px;padding:3px;background:#f1f5ee;border-radius:10px;flex-shrink:0}
#views button{border:0;background:none;font-size:11px;padding:7px 12px}
#views button[aria-pressed=true]{background:#fff;color:#2d6a54;box-shadow:0 2px 6px #304a3110}
.canvas-wrap{position:relative;flex:1;min-height:0;margin:0 20px 12px;border:1px solid #dfe8dc;border-radius:18px;overflow:hidden;background:#fafcf8;display:flex;flex-direction:column}
#viewport{flex:1;min-height:0;overflow:auto;position:relative;cursor:grab;background-image:radial-gradient(#d3dfcc .85px,transparent .85px);background-size:22px 22px;overscroll-behavior:contain;touch-action:pan-x pan-y}
#viewport:active{cursor:grabbing}
#space{position:relative;margin:auto;transform-origin:top left}
#graph{position:relative;transform-origin:top left}
svg{position:absolute;inset:0;pointer-events:none}
path.edge{stroke:#c3d1bd;stroke-width:1.5;fill:none;transition:opacity .15s,stroke-width .15s}
path.edge.highlighted{opacity:.95!important;stroke-width:2.3}
path.edge.dimmed{opacity:.14!important}
circle.orbit{fill:none;stroke:#c8d6c7;stroke-width:1;stroke-dasharray:4 6;opacity:.48}
.node{position:absolute;text-align:left;white-space:normal;overflow:hidden;box-shadow:0 4px 16px #2a473208;border-radius:14px;transition:opacity .15s,box-shadow .15s,transform .15s}
.node.dimmed{opacity:.18!important}
.root{width:190px;height:86px;border:0!important;background:linear-gradient(125deg,#1f5644,#3a745c)!important;color:#fff;box-shadow:0 10px 26px #2d6a542b}
.subject{width:210px;min-height:70px;border:1px solid #dde6d8;border-top:3px solid var(--accent);background:#fff;padding:12px 16px}
.group{width:236px;min-height:68px;background:#f3f7ee;border:1px solid #d8e4ce;padding:12px 16px}
.course{width:228px;min-height:60px;background:#fff;padding:10px 14px}
.node .title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;line-height:1.4;font-weight:560}
.node.subject .title{font-size:15px}
.node .count{display:block;margin-top:4px;font-size:10.5px;color:#788c7d;font-weight:450}
.node .course-src{display:inline-block;margin-top:5px;font-size:10px;color:#5f7968;background:#eff4ec;padding:1px 7px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.canvas-tools{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:3px;align-items:center;padding:5px;border:1px solid #dde6d6;border-radius:14px;background:#ffffffef;backdrop-filter:blur(8px);box-shadow:0 6px 24px #28462c12;z-index:3;white-space:nowrap}
.canvas-tools button{border:0;background:none;padding:8px 11px;font-size:11px}
.canvas-tools button:hover{background:#edf4e6}
.tool-separator{height:18px;width:1px;background:#e1e8d9;margin:0 3px}
#tooltip{position:absolute;z-index:5;pointer-events:none;background:#1e352d;color:#f6faf4;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.45;max-width:290px;box-shadow:0 10px 28px #12261e38}
#tooltip strong{display:block;font-weight:600}
#tooltip span{display:block;font-size:10.5px;color:#bed2c4;margin-top:2px}
footer{display:flex;justify-content:space-between;gap:12px;padding:0 26px 18px;font-size:10.5px;color:#7d9180}
footer a{color:#2d6a54}
dialog{border:1px solid #dbe5d5;border-radius:20px 0 0 20px;border-right:0;padding:28px 26px;width:min(440px,92vw);max-width:none;height:100dvh;max-height:100dvh;margin:0 0 0 auto;overflow-y:auto;box-shadow:-16px 0 60px #1f362624;background:#fff}
dialog::backdrop{background:#1d33264a;backdrop-filter:blur(4px)}
.drawer-crumb{font-size:11px;color:#6c8372;margin:18px 0 8px;font-weight:500}
dialog h2{margin:0 0 12px}
dialog h2 .title{font-size:22px;line-height:1.38;display:block;font-weight:650;color:#1e352d}
dialog p{font-size:14px;line-height:1.75;color:#54675b;white-space:pre-line;margin:0 0 20px}
.sources{display:grid;gap:9px}
.sources a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 15px;border:1px solid #dde6d6;border-radius:12px;overflow-wrap:anywhere;font-size:13px;font-weight:500;background:#fafcf9;transition:background .15s,border-color .15s}
.sources a:hover{background:#eef5ea;border-color:#b8ccb9}
.siblings-head{margin:26px 0 10px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#7c9080;font-weight:600}
.siblings{display:grid;gap:6px}
.siblings button{text-align:left;padding:10px 12px;font-size:12.5px;border-radius:10px;border:1px solid #e6ede2;background:#fbfcf9;display:flex;justify-content:space-between;align-items:center;gap:8px}
.siblings button:hover{background:#edf4e7;border-color:#bfd2bf}
.siblings button span:last-child{font-size:10px;color:#788c7d;flex-shrink:0}
#return{border:0;background:#edf4e5;color:#356347;font-weight:550;padding:8px 13px}
#empty{text-align:center;padding:80px 20px;color:#829485}

/* List view */
body[data-view=list] #viewport{flex:1;min-height:0;cursor:default;background:none;padding:12px 24px 24px}
body[data-view=list] #space,body[data-view=list] #graph{width:100%!important;height:auto!important;transform:none!important}
body[data-view=list] #graph{display:flex;flex-direction:column;gap:8px;max-width:900px;margin:auto}
body[data-view=list] svg,body[data-view=list] .root{display:none}
body[data-view=list] .node{position:static!important;width:auto!important;height:auto!important;min-height:54px;order:var(--order);transition:none}
body[data-view=list] .subject{margin-top:16px}
body[data-view=list] .group{margin-left:18px}
body[data-view=list] .course{margin-left:36px;display:flex;justify-content:space-between;align-items:center;gap:12px}
body[data-view=list] .course .course-src{margin-top:0;flex-shrink:0}
body[data-view=list] .title{display:block}
body[data-view=list] .canvas-tools{position:static;transform:none;align-self:center;margin:10px auto 12px;box-shadow:0 2px 12px #28462c0d}
body[data-view=list] #minus,body[data-view=list] #plus,body[data-view=list] #fit,body[data-view=list] .tool-separator{display:none}

/* Map node base + 3-level LOD */
body[data-view=map] .node{border-radius:16px;padding:9px 13px;box-shadow:0 4px 14px #2b4a340b}
body[data-view=map] .root{border-radius:28px;display:flex;align-items:center;justify-content:center;text-align:center}
body[data-view=map] .node.root .title{font-size:18px!important;line-height:1.3}
body[data-view=map] .subject{border:2px solid var(--accent);background:#f9fcf6;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
body[data-view=map] .group{border:1.5px solid var(--accent);background:#f2f7ec;display:flex;flex-direction:column;justify-content:center}
body[data-view=map] .course{border:1px solid #d8e3d0;background:#ffffffef}
body[data-view=map] .node .title{font-size:12px!important;line-height:1.35;-webkit-line-clamp:2}
body[data-view=map] .node.subject .title{font-size:15px!important}
body[data-view=map] .node.group .title{font-size:13px!important}
body[data-view=map] .node .count{font-size:10px!important;margin-top:2px}

/* LOD 1: Overview (zoom < 0.34) */
body.lod-overview[data-view=map] .root{transform:scale(2.15);z-index:3}
body.lod-overview[data-view=map] .subject{transform:scale(1.85);z-index:2;padding:8px 12px}
body.lod-overview[data-view=map] .group{background:none;border:0;box-shadow:none;overflow:visible}
body.lod-overview[data-view=map] .group .title,body.lod-overview[data-view=map] .group .count{display:none}
body.lod-overview[data-view=map] .group:before{content:'';display:block;width:36px;height:36px;border:3px solid var(--accent);background:#e7efe0;border-radius:50%;position:absolute;left:calc(50% - 18px);top:calc(50% - 18px);box-shadow:0 0 0 6px #ffffffb8}
body.lod-overview[data-view=map] .course{background:none;border:0;box-shadow:none;overflow:visible}
body.lod-overview[data-view=map] .course .title,body.lod-overview[data-view=map] .course .course-src{display:none}
body.lod-overview[data-view=map] .course:before{content:'';display:block;width:20px;height:20px;border:2px solid #fff;background:var(--accent);border-radius:50%;position:absolute;left:calc(50% - 10px);top:calc(50% - 10px);box-shadow:0 0 0 6px #7c9e7e16}

/* LOD 2: Topics visible (0.34 <= zoom < 0.62) */
body.lod-topics[data-view=map] .root{transform:scale(1.3);z-index:3}
body.lod-topics[data-view=map] .subject{transform:scale(1.22);z-index:2}
body.lod-topics[data-view=map] .group{z-index:2;box-shadow:0 6px 18px #26473014}
body.lod-topics[data-view=map] .course{background:none;border:0;box-shadow:none;overflow:visible}
body.lod-topics[data-view=map] .course .title,body.lod-topics[data-view=map] .course .course-src{display:none}
body.lod-topics[data-view=map] .course:before{content:'';display:block;width:22px;height:22px;border:2px solid #fff;background:var(--accent);border-radius:50%;position:absolute;left:calc(50% - 11px);top:calc(50% - 11px);box-shadow:0 0 0 6px #6b8e7818}

@media(max-width:760px){
  body{padding:0;background:#fff}
  .shell{display:block;height:auto;min-height:100dvh;border:0;border-radius:0}
  .sidebar{padding:14px 16px 0;border:0;display:block;overflow:visible}
  .brand{font-size:9px;letter-spacing:1px}
  .brand img{width:28px;height:28px}
  .sidebar h1{margin:12px 0 4px;font-size:24px}
  .sidebar p{margin:0;font-size:11px}
  .nav-label,#subject-nav{display:none}
  #subject-filter{display:block;border:1px solid #dce5da;background:#fff;border-radius:10px;padding:9px 10px;font-size:12px;width:100%;margin-top:12px}
  .topbar{height:auto;padding:10px 16px;border:0;gap:8px}
  #search{font-size:12px;padding:10px 12px}
  #language{flex-shrink:0}
  #language button{font-size:10px;padding:7px 7px}
  .canvas-head{padding:2px 16px 10px;gap:8px}
  .canvas-title,.crumb-btn{font-size:13px}
  #status{font-size:10px}
  #views button{font-size:10px;padding:7px 9px}
  .canvas-wrap{margin:0 10px 10px;border-radius:16px}
  #viewport{height:calc(100dvh - 300px);min-height:340px;flex:none}
  body[data-view=list] #viewport{height:auto;min-height:320px;padding:4px 10px 12px}
  #graph{width:var(--graph-width)!important;height:var(--graph-height)!important;transform:scale(var(--zoom))!important}
  #space{width:var(--space-width)!important;height:var(--space-height)!important}
  .canvas-tools{bottom:10px;gap:0;padding:4px;max-width:calc(100% - 16px)}
  .canvas-tools button{padding:8px 8px;font-size:10px;min-height:36px}
  .tool-separator{margin:0 1px}
  footer{padding:0 16px 16px;font-size:9.5px;line-height:1.5;gap:8px}
  footer a{white-space:nowrap}
  dialog{width:calc(100% - 20px);height:auto;max-height:88dvh;margin:auto;border-radius:20px;border-right:1px solid #dbe5d5;padding:20px}
  dialog h2 .title{font-size:19px}
  body[data-view=list] .group{margin-left:10px}
  body[data-view=list] .course{margin-left:20px;flex-direction:column;align-items:flex-start;gap:4px}
}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand"><img src="icon.png?v=teal-orbit-3" alt="" width="38" height="38"><span>STUDY IS WONDERFUL</span></div><div class="eyebrow" id="eyebrow"></div><h1 id="app-title"></h1><p id="tagline"></p><div class="nav-label" id="nav-label"></div><div id="subject-nav"></div><select id="subject-filter"></select></aside><section class="workspace"><header class="topbar"><input id="search" type="search"><nav id="language" aria-label="Language"><button id="zh" lang="zh-CN">中文</button><button id="en" lang="en">English</button></nav></header><div class="canvas-head"><div class="canvas-copy"><span class="canvas-title" id="canvas-title"></span><span id="status" aria-live="polite"></span></div><div id="views"><button id="map-view"></button><button id="list-view"></button></div></div><div class="canvas-wrap"><main id="viewport" tabindex="0"><div id="space"><div id="graph"></div></div></main><div id="tooltip" role="tooltip" hidden></div><div class="canvas-tools"><button id="expand"></button><button id="collapse"></button><span class="tool-separator"></span><button id="minus">−</button><button id="plus">＋</button><button id="fit"></button><button id="home"></button></div></div><footer><span id="hint"></span><a id="readme" target="_blank" rel="noopener"></a></footer></section></div>
<dialog id="detail"><button id="return"></button><div class="drawer-crumb" id="drawer-crumb"></div><h2 id="detail-title"></h2><p id="description"></p><div class="sources" id="sources"></div><div class="siblings-head" id="siblings-head"></div><div class="siblings" id="siblings"></div></dialog>
<script>
const COURSES=/*__COURSES__*/;
const graph=document.querySelector('#graph'),viewport=document.querySelector('#viewport'),space=document.querySelector('#space'),dialog=document.querySelector('#detail'),tooltip=document.querySelector('#tooltip');
let lang='zh';try{lang=localStorage.getItem('study-language')==='en'?'en':'zh'}catch{}
const UI={
  zh:{title:'学习星图',eyebrow:'让好奇心，连接下一程',tagline:'循着兴趣展开，找到下一门好课。',search:'搜索课程、学校、平台或主题…',expand:'全部展开',collapse:'全部收起',home:'返回全景',back:'← 返回星图',hint:'点击主题展开，点击课程查看介绍与学习入口。',readme:'在目录中定位',empty:'没有找到课程，试试其他关键词。',root:'学习资源',course:'门课程',subject:'学科',visible:'门已展开',minus:'缩小',plus:'放大',fit:'适应画布',all:'全部学科',filter:'选择学科',map:'知识图谱',list:'分层列表',gesture:'滚轮缩放 · 拖动探索 · 悬停查看简介 · 连线仅表示学科归属（不代表先修）',open:'打开课程入口',siblings:'同主题其他课程'},
  en:{title:'Learning, connected.',eyebrow:'STUDY IS WONDERFUL',tagline:'Follow your curiosity. Find your next course.',search:'Search courses, schools, platforms or topics…',expand:'Expand all',collapse:'Collapse all',home:'Overview',back:'← Back to map',hint:'Expand a topic. Select a course for details and learning links.',readme:'Locate in catalog',empty:'No courses found. Try another keyword.',root:'Learning resources',course:'courses',subject:'subjects',visible:'visible',minus:'Zoom out',plus:'Zoom in',fit:'Fit view',all:'All subjects',filter:'Choose subject',map:'Knowledge graph',list:'List',gesture:'Scroll to zoom · Drag to pan · Hover for preview · Edges show catalog membership (not prerequisites)',open:'Open course',siblings:'More in this topic'}
};
const local=c=>c.locales[lang];
const label=(s,kind)=>local(COURSES.find(c=>c[kind]===s))[kind];
const subjects=[...new Set(COURSES.map(c=>c.subject))];
const expanded=new Set();
const graphFolded=new Set();
const palette=['#2d7a64','#c48a3a','#3b6fa0','#c4654a','#7b5fa3','#2c8c8c','#6c8c3e','#b04f62','#a88435','#4e5d94'];
let zoom=1,lastNode=null,query='',view=window.innerWidth<=760?'list':'map',selected='',graphCollapsed=false,userCollapsed=false,graphWidth=1000,graphHeight=590;
let currentNodes=[],currentEdges=[];

function applyLanguage(){
  const t=UI[lang];
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=t.title+' · Study Is Wonderful';
  for(const [id,k] of Object.entries({'app-title':'title',eyebrow:'eyebrow',tagline:'tagline',expand:'expand',collapse:'collapse',home:'home',fit:'fit',return:'back','map-view':'map','list-view':'list','siblings-head':'siblings'}))
    document.getElementById(id).textContent=t[k];
  const input=document.querySelector('#search');
  input.placeholder=t.search;input.setAttribute('aria-label',t.search);
  document.querySelector('#minus').setAttribute('aria-label',t.minus);
  document.querySelector('#plus').setAttribute('aria-label',t.plus);
  viewport.setAttribute('aria-label',t.title);
  document.querySelector('#readme').href='https://github.com/xioacd99/study-is-wonderful/blob/dev/'+(lang==='zh'?'README.md':'README-en.md')+'#resource-map';
  document.querySelector('#readme').textContent=lang==='zh'?'阅读完整目录 ↗':'Browse full catalog ↗';
  const select=document.querySelector('#subject-filter');
  select.setAttribute('aria-label',t.filter);select.replaceChildren();
  for(const value of ['',...subjects]){
    const option=document.createElement('option');
    option.value=value;option.textContent=value?label(value,'subject'):t.all;
    select.append(option);
  }
  select.value=selected;
  for(const l of ['zh','en'])document.getElementById(l).setAttribute('aria-pressed',String(lang===l));
  render();
  if(view==='map')fit();
}
for(const l of ['zh','en'])document.getElementById(l).onclick=()=>{lang=l;try{localStorage.setItem('study-language',l)}catch{}applyLanguage()};

function titleEl(el,text){const a=document.createElement('span');a.className='title';a.textContent=text;el.append(a)}
function node(cls,x,y,text,fn){
  const b=document.createElement('button');
  b.type='button';b.className='node '+cls;b.style.left=x+'px';b.style.top=y+'px';
  titleEl(b,text);b.onclick=fn;graph.append(b);return b;
}

function updateLOD(){
  const isOverview=view==='map'&&zoom<.34;
  const isTopics=view==='map'&&zoom>=.34&&zoom<.62;
  const isDetail=view==='map'&&zoom>=.62;
  document.body.classList.toggle('graph-overview',isOverview);
  document.body.classList.toggle('lod-overview',isOverview);
  document.body.classList.toggle('lod-topics',isTopics);
  document.body.classList.toggle('lod-detail',isDetail);
}

function sizeGraph(width,height){
  graphWidth=width;graphHeight=height;
  graph.style.width=width+'px';graph.style.height=height+'px';
  if(view==='map'){
    space.style.width=width*zoom+'px';space.style.height=height*zoom+'px';
    graph.style.transform=`scale(${zoom})`;
    space.style.marginTop=Math.max(0,(viewport.clientHeight-height*zoom)/2-14)+'px';
    graph.style.setProperty('--graph-width',width+'px');
    graph.style.setProperty('--graph-height',height+'px');
    graph.style.setProperty('--zoom',zoom);
    space.style.setProperty('--space-width',width*zoom+'px');
    space.style.setProperty('--space-height',height*zoom+'px');
  }else{
    space.style.width='100%';space.style.height='auto';space.style.marginTop='0';
    graph.style.transform='none';
  }
  updateLOD();
}

function applyZoom(next,anchorClientX,anchorClientY){
  if(view==='list')return;
  const clamped=Math.max(.12,Math.min(2.0,next));
  const rect=viewport.getBoundingClientRect();
  const hasAnchor=typeof anchorClientX==='number'&&typeof anchorClientY==='number';
  const offsetX=hasAnchor?(anchorClientX-rect.left):viewport.clientWidth/2;
  const offsetY=hasAnchor?(anchorClientY-rect.top):viewport.clientHeight/2;
  const prevTopMargin=parseFloat(space.style.marginTop)||0;
  const prevLeftMargin=Math.max(0,(viewport.clientWidth-graphWidth*zoom)/2);
  const gx=(viewport.scrollLeft+offsetX-prevLeftMargin)/zoom;
  const gy=(viewport.scrollTop+offsetY-prevTopMargin)/zoom;
  zoom=clamped;
  sizeGraph(graphWidth,graphHeight);
  const newTopMargin=parseFloat(space.style.marginTop)||0;
  const newLeftMargin=Math.max(0,(viewport.clientWidth-graphWidth*zoom)/2);
  viewport.scrollTo(Math.max(0,gx*zoom+newLeftMargin-offsetX),Math.max(0,gy*zoom+newTopMargin-offsetY));
  hideTooltip();
}
function setZoom(next){applyZoom(next)}

function fit(){
  if(view==='list')return;
  const padX=56,padY=92;
  const next=Math.max(.12,Math.min(1.15,(viewport.clientWidth-padX)/graphWidth,(viewport.clientHeight-padY)/graphHeight));
  zoom=next;
  sizeGraph(graphWidth,graphHeight);
  viewport.scrollTo(Math.max(0,(graphWidth*zoom-viewport.clientWidth)/2),Math.max(0,(graphHeight*zoom-viewport.clientHeight)/2));
}

function focusSubject(s){

function drawEdges(edges,width,height){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',width);svg.setAttribute('height',height);
  for(const [x1,y1,x2,y2,color]of edges){
    const p=document.createElementNS(svg.namespaceURI,'path');
    p.setAttribute('class','edge');
    p.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);
    p.style.stroke=color||'#a4beb2';svg.append(p);
  }
  graph.prepend(svg);
}

function render(){
  hideTooltip();
  document.querySelector('#nav-label').textContent=lang==='zh'?'探索学科':'EXPLORE SUBJECTS';
  renderTitle();
  const nav=document.querySelector('#subject-nav');nav.replaceChildren();
  for(const s of ['',...subjects]){

    const count=document.createElement('span');count.textContent=s?COURSES.filter(c=>c.subject===s).length:COURSES.length;

  }
  document.body.dataset.view=view;
  document.querySelector('#map-view').setAttribute('aria-pressed',String(view==='map'));
  document.querySelector('#list-view').setAttribute('aria-pressed',String(view==='list'));

  graph.replaceChildren();
  const q=query.trim().toLocaleLowerCase();
  const shown=subjects.filter(s=>!selected||s===selected).map(s=>({
    s,
    c:COURSES.filter(c=>c.subject===s&&(!q||(c.title+' '+c.description+' '+c.subject+' '+c.group+' '+c.links.map(l=>(l.source||'')+' '+l.url).join(' ')).toLocaleLowerCase().includes(q)))
  })).filter(x=>x.c.length);

  if(view==='map'){renderKnowledge(shown);return}

  if(!q&&!userCollapsed&&expanded.size===0){
    if(selected){
      expanded.add(selected);
      COURSES.filter(c=>c.subject===selected).forEach(c=>expanded.add(c.subject+'|'+c.group));
    }else{
      subjects.forEach(s=>expanded.add(s));
    }
  }
  const edges=[];let y=24,n=0;
  for(const {s,c} of shown){
    const open=expanded.has(s)||!!q,start=y,groupPositions=[];
    if(open){
      for(const g of [...new Set(c.map(x=>x.group))]){
        const gc=c.filter(x=>x.group===g),key=s+'|'+g,go=expanded.has(key)||!!q,gh=go?gc.length*96:98,gy=y+gh/2-34;
        const gb=node('group',570,gy,label(g,'group'),()=>{expanded.has(key)?expanded.delete(key):expanded.add(key);userCollapsed=expanded.size===0;render()});
        gb.setAttribute('aria-expanded',String(go));gb.dataset.group=key;gb.style.setProperty('--order',String(subjects.indexOf(s)*1000+c.indexOf(gc[0])*2+1));
        const ct=document.createElement('span');ct.className='count';ct.textContent=(go?'− ':'＋ ')+gc.length+' '+UI[lang].course;gb.append(ct);
        groupPositions.push(gy+34);
        if(go)gc.forEach((course,i)=>{
          const cy=y+i*96,b=node('course',900,cy,local(course).title,()=>show(course,b));
          b.dataset.course=course.id;b.style.setProperty('--order',String(subjects.indexOf(s)*1000+c.indexOf(course)*2+2));
          const src=document.createElement('span');src.className='course-src';src.textContent=[...new Set(course.links.map(l=>l.source).filter(Boolean))].join(' · ');
          if(src.textContent)b.append(src);
          edges.push([820,gy+34,900,cy+34]);n++;
        });
        y+=gh+20;
      }
    }else y+=112;
    const sy=start+(y-start-20)/2-34;
    const b=node('subject',280,sy,label(s,'subject'),()=>{expanded.has(s)?expanded.delete(s):expanded.add(s);userCollapsed=expanded.size===0;render()});
    b.style.setProperty('--accent',palette[subjects.indexOf(s)%palette.length]);
    b.setAttribute('aria-expanded',String(open));b.dataset.subject=s;b.style.setProperty('--order',String(subjects.indexOf(s)*1000));
    const count=document.createElement('span');count.className='count';count.textContent=(open?'− ':'＋ ')+c.length+' '+UI[lang].course;b.append(count);
    edges.push([235,null,280,sy+34]);for(const gy of groupPositions)edges.push([510,sy+34,570,gy]);
  }
  const height=Math.max(440,y),width=1280,rootY=height/2;
  node('root',30,rootY-43,UI[lang].root,()=>home());
  edges.forEach(e=>{if(e[1]===null)e[1]=rootY});
  drawEdges(edges,width,height);sizeGraph(width,height);
  document.querySelector('#status').textContent=`${COURSES.length} ${UI[lang].course} · ${shown.length} ${UI[lang].subject}`+(n?` · ${n} ${UI[lang].visible}`:'');
  if(!shown.length){const empty=document.createElement('p');empty.id='empty';empty.textContent=UI[lang].empty;graph.append(empty)}
}

function hideTooltip(){tooltip.hidden=true;document.querySelectorAll('.dimmed').forEach(el=>el.classList.remove('dimmed'));document.querySelectorAll('.highlighted').forEach(el=>el.classList.remove('highlighted'))}

function showSpotlight(nodeObj,el){
  if(view!=='map')return;
  const active=new Set([nodeObj.id]);
  if(nodeObj.cls==='subject'){
    currentNodes.forEach(n=>{if(n.parent?.id===nodeObj.id||(n.parent?.parent?.id===nodeObj.id))active.add(n.id)});
  }else if(nodeObj.cls==='group'){
    if(nodeObj.parent)active.add(nodeObj.parent.id);
    currentNodes.forEach(n=>{if(n.parent?.id===nodeObj.id)active.add(n.id)});
  }else if(nodeObj.cls==='course'){
    if(nodeObj.parent){active.add(nodeObj.parent.id);if(nodeObj.parent.parent)active.add(nodeObj.parent.parent.id)}
  }
  if(active.size>1&&nodeObj.id!=='root'){
    document.querySelectorAll('#graph .node').forEach(dom=>dom.classList.toggle('dimmed',!active.has(dom.dataset.graphNode)));
    document.querySelectorAll('#graph path.edge').forEach(p=>{
      const ok=active.has(p.dataset.from)&&active.has(p.dataset.to);
      p.classList.toggle('highlighted',ok);
      p.classList.toggle('dimmed',!ok);
    });
  }
  const wrapRect=document.querySelector('.canvas-wrap').getBoundingClientRect();
  const r=el.getBoundingClientRect();
  tooltip.replaceChildren();
  const strong=document.createElement('strong');strong.textContent=nodeObj.text;tooltip.append(strong);
  const sub=document.createElement('span');
  if(nodeObj.course){
    const d=local(nodeObj.course);
    const srcs=[...new Set(d.links.map(l=>l.source).filter(Boolean))].join(' · ');
    sub.textContent=d.subject+' › '+d.group+(srcs?' · '+srcs:'');
  }else if(nodeObj.count){
    sub.textContent=nodeObj.count+' '+UI[lang].course;
  }
  if(sub.textContent)tooltip.append(sub);
  tooltip.hidden=false;
  const tw=tooltip.offsetWidth||220,th=tooltip.offsetHeight||48;
  const left=Math.max(10,Math.min(wrapRect.width-tw-10,r.left-wrapRect.left+r.width/2-tw/2));
  let top=r.top-wrapRect.top-th-10;
  if(top<8)top=r.bottom-wrapRect.top+10;
  tooltip.style.left=left+'px';tooltip.style.top=top+'px';
}

function renderKnowledge(shown){
  const nodes=[],links=[];
  const singleHub=Boolean(selected&&shown.length===1);
  let hub;
  if(singleHub){
    const {s,c}=shown[0];
    const color=palette[subjects.indexOf(s)%palette.length];
    hub={id:s,cls:'subject',text:label(s,'subject'),x:0,y:0,w:200,h:68,fn:home,color,count:c.length};
    nodes.push(hub);
  }else{
    hub={id:'root',cls:'root',text:UI[lang].root,x:0,y:0,w:148,h:74,fn:home};
    nodes.push(hub);
  }
  const add=(id,cls,text,x,y,w,h,parent,fn,color)=>{const n={id,cls,text,x,y,w,h,parent,fn,color};nodes.push(n);links.push([parent,n]);return n};

  if(singleHub){
    const {s,c}=shown[0];
    const groups=[...new Set(c.map(x=>x.group))];
    const groupRadius=Math.max(250,Math.min(340,210+groups.length*14));
    groups.forEach((g,gi)=>{
      const ga=-Math.PI/2+gi*Math.PI*2/Math.max(1,groups.length);
      const gc=c.filter(x=>x.group===g),key=s+'|'+g;
      const group=add(key,'group',label(g,'group'),Math.cos(ga)*groupRadius,Math.sin(ga)*groupRadius,196,60,hub,()=>{graphFolded.has(key)?graphFolded.delete(key):graphFolded.add(key);render();fit()},hub.color);
      group.count=gc.length;
      if(graphFolded.has(key)&&!query)return;
      gc.forEach((course,ci)=>{
        const ca=ga+(ci-(gc.length-1)/2)*.36;
        const dist=165+(ci%2)*55;
        const cn=add(course.id,'course',local(course).title,group.x+Math.cos(ca)*dist,group.y+Math.sin(ca)*dist,212,58,group,null,hub.color);
        cn.course=course;
      });
    });
  }else{
    shown.forEach(({s,c},si)=>{
      const angle=-Math.PI/2+si*Math.PI*2/Math.max(1,shown.length),radius=640;
      const sub=add(s,'subject',label(s,'subject'),Math.cos(angle)*radius,Math.sin(angle)*radius,190,64,hub,()=>focusSubject(s),palette[subjects.indexOf(s)%palette.length]);
      sub.count=c.length;
      if(graphCollapsed&&!query)return;
      const groups=[...new Set(c.map(x=>x.group))];
      groups.forEach((g,gi)=>{
        const ga=angle+(gi-(groups.length-1)/2)*.68,gc=c.filter(x=>x.group===g),key=s+'|'+g;
        const group=add(key,'group',label(g,'group'),sub.x+Math.cos(ga)*270,sub.y+Math.sin(ga)*270,188,58,sub,()=>{graphFolded.has(key)?graphFolded.delete(key):graphFolded.add(key);render()},sub.color);
        group.count=gc.length;
        if(graphFolded.has(key)&&!query)return;
        gc.forEach((course,ci)=>{
          const ca=ga+(ci-(gc.length-1)/2)*.46;
          const n=add(course.id,'course',local(course).title,group.x+Math.cos(ca)*(185+ci%2*60),group.y+Math.sin(ca)*(185+ci%2*60),210,56,group,null,sub.color);
          n.course=course;
        });
      });
    });
  }

  // Deterministic spring layout: only catalog membership edges, never inferred prerequisites.
  for(let step=0;step<210;step++){
    const force=nodes.map(()=>({x:0,y:0}));
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        let dx=b.x-a.x,dy=b.y-a.y;
        if(Math.abs(dx)+Math.abs(dy)<.01){dx=.1*(j+1);dy=.13*(i+1)}
        const dist=Math.hypot(dx,dy),gapX=(a.w+b.w)/2+22-Math.abs(dx),gapY=(a.h+b.h)/2+22-Math.abs(dy);
        let strength=5800/(dist*dist+500);
        if(gapX>0&&gapY>0)strength+=Math.min(gapX,gapY)*.18;
        force[i].x-=dx/dist*strength;force[i].y-=dy/dist*strength;
        force[j].x+=dx/dist*strength;force[j].y+=dy/dist*strength;
      }
    }
    for(const [a,b]of links){
      const bi=nodes.indexOf(b),ai=nodes.indexOf(a),dx=b.x-a.x,dy=b.y-a.y,d=Math.max(1,Math.hypot(dx,dy));
      const target=b.cls==='subject'?640:b.cls==='group'?(singleHub?290:240):(singleHub?175:170);
      const k=(d-target)*.026;
      force[bi].x-=dx/d*k;force[bi].y-=dy/d*k;force[ai].x+=dx/d*k;force[ai].y+=dy/d*k;
    }
    nodes.forEach((n,i)=>{if(i){n.x+=Math.max(-15,Math.min(15,force[i].x));n.y+=Math.max(-15,Math.min(15,force[i].y))}});
  }
  // Resolve remaining label collisions without changing any graph relationship.
  for(let k=0;k<36;k++)for(let i=1;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,ox=(a.w+b.w)/2+12-Math.abs(dx),oy=(a.h+b.h)/2+12-Math.abs(dy);
    if(ox>0&&oy>0){
      if(ox<oy){const push=(ox+.2)/2*(dx>=0?1:-1);a.x-=push;b.x+=push}
      else{const push=(oy+.2)/2*(dy>=0?1:-1);a.y-=push;b.y+=push}
    }
  }

  const minX=Math.min(...nodes.map(n=>n.x-n.w/2))-70,minY=Math.min(...nodes.map(n=>n.y-n.h/2))-70;
  const width=Math.max(700,Math.max(...nodes.map(n=>n.x+n.w/2))-minX+70);
  const height=Math.max(540,Math.max(...nodes.map(n=>n.y+n.h/2))-minY+70);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',width);svg.setAttribute('height',height);
  const cx=hub.x-minX,cy=hub.y-minY;
  for(const r of (singleHub?[280,460]:[560,840,1120])){
    const ring=document.createElementNS(svg.namespaceURI,'circle');
    ring.setAttribute('class','orbit');ring.setAttribute('cx',cx);ring.setAttribute('cy',cy);ring.setAttribute('r',r);
    svg.append(ring);
  }
  for(const [a,b]of links){
    const line=document.createElementNS(svg.namespaceURI,'path');
    line.setAttribute('class','edge');
    line.dataset.from=a.id;line.dataset.to=b.id;
    line.setAttribute('d',`M${a.x-minX},${a.y-minY} Q${(a.x+b.x)/2-minX+18},${(a.y+b.y)/2-minY-18} ${b.x-minX},${b.y-minY}`);
    line.style.stroke=b.color||'#a5b9a0';line.style.opacity='.58';
    svg.append(line);
  }
  graph.append(svg);

  currentNodes=nodes;currentEdges=links;
  for(const n of nodes){
    const el=node(n.cls,n.x-n.w/2-minX,n.y-n.h/2-minY,n.text,()=>n.course?show(n.course,el):n.fn());
    el.style.width=n.w+'px';el.style.height=n.h+'px';el.style.minHeight=n.h+'px';
    el.style.setProperty('--accent',n.color||'#2d7a64');
    if(n.course){
      el.dataset.course=n.id;
      const srcs=[...new Set(local(n.course).links.map(l=>l.source).filter(Boolean))];
      if(srcs.length){const s=document.createElement('span');s.className='course-src';s.textContent=srcs[0];el.append(s)}
    }else if(n.id!=='root'){
      const count=document.createElement('span');count.className='count';count.textContent=n.count+' '+UI[lang].course;el.append(count);
    }
    el.dataset.graphNode=n.id;
    if(n.parent)el.dataset.parent=n.parent.id;
    el.setAttribute('aria-label',n.text);
    el.addEventListener('pointerenter',()=>showSpotlight(n,el));
    el.addEventListener('pointerleave',hideTooltip);
    el.addEventListener('focus',()=>showSpotlight(n,el));
    el.addEventListener('blur',hideTooltip);
    if(n.cls==='group')el.addEventListener('dblclick',e=>{e.stopPropagation();const r=el.getBoundingClientRect();applyZoom(.9,r.left+r.width/2,r.top+r.height/2)});
  }
  sizeGraph(width,height);
  document.querySelector('#status').textContent=`${nodes.filter(n=>n.course).length} / ${COURSES.length} ${UI[lang].course} · ${shown.length} ${UI[lang].subject}`;
  if(!shown.length){const empty=document.createElement('p');empty.id='empty';empty.textContent=UI[lang].empty;graph.append(empty)}
}

function show(c,b){
  if(b)lastNode=b;
  const d=local(c);
  document.querySelector('#drawer-crumb').textContent=d.subject+' › '+d.group;
  const heading=document.querySelector('#detail-title');heading.replaceChildren();titleEl(heading,d.title);
  document.querySelector('#description').textContent=d.description;
  const sources=document.querySelector('#sources');sources.replaceChildren();
  for(const link of d.links){
    const a=document.createElement('a');
    const src=link.source||'';
    const labelText=src?(link.label===d.title?src+' · '+UI[lang].open:src+' · '+link.label):link.label;
    const tSpan=document.createElement('span');tSpan.textContent=labelText;
    const arrow=document.createElement('span');arrow.textContent='↗';
    a.append(tSpan,arrow);
    a.href=link.url;a.target='_blank';a.rel='noopener noreferrer';sources.append(a);
  }
  const readme=document.createElement('a');
  const rSpan=document.createElement('span');rSpan.textContent=UI[lang].readme;
  const rArrow=document.createElement('span');rArrow.textContent='↗';
  readme.append(rSpan,rArrow);

  readme.target='_blank';readme.rel='noopener';sources.append(readme);

  const siblings=COURSES.filter(x=>x.subject===c.subject&&x.group===c.group&&x.id!==c.id);
  const sibHead=document.querySelector('#siblings-head'),sibList=document.querySelector('#siblings');

}

let pinch=null;

  if(view==='map'&&e.touches.length===2){
    const [a,b]=e.touches;
    pinch={dist:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),zoom};

},{passive:true});
viewport.addEventListener('touchmove',e=>{
  if(view==='map'&&pinch&&e.touches.length===2){
    e.preventDefault();
    const [a,b]=e.touches;
    const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    applyZoom(pinch.zoom*(dist/Math.max(1,pinch.dist)),(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);
  }
},{passive:false});
viewport.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});

let drag=null;
viewport.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&!e.target.closest('button')){
    drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};
    viewport.setPointerCapture(e.pointerId);
  }
});
viewport.addEventListener('pointermove',e=>{
  if(drag){viewport.scrollLeft=drag.left-(e.clientX-drag.x);viewport.scrollTop=drag.top-(e.clientY-drag.y)}
});
viewport.addEventListener('pointerup',()=>drag=null);
viewport.addEventListener('pointercancel',()=>drag=null);

applyLanguage();
</script></body></html>
